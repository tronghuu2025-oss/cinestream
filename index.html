<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>CineStream Ultimate</title>
<style>
:root{--bg:#090d16;--panel:#111827;--panel2:#172235;--line:#26344b;--txt:#f4f7fb;--muted:#9ba9bd;--red:#f0445e;--gold:#f5b942;--green:#43d19e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 20% -15%,#1d2944 0,transparent 42%),var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ff6c82;outline-offset:3px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.topbar{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 clamp(14px,4vw,54px);background:#090d16ed;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.5px;font-size:20px;white-space:nowrap}.brandmark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#ff4565,#a51c48);box-shadow:0 8px 24px #e52d5540}.brand span:last-child{color:#ff6279}.nav{display:flex;gap:5px;margin-left:12px}.nav button,.ghost{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover,.ghost:hover{background:#1a263a;color:white}.spacer{flex:1}.search{width:min(290px,28vw);background:#111a29;border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:white}.primary,.secondary,.danger{border:0;border-radius:11px;padding:10px 15px;font-weight:750}.primary{background:linear-gradient(120deg,#fa4966,#d92b50);box-shadow:0 8px 22px #e52d5530}.secondary{background:#1a263a;border:1px solid var(--line)}.danger{background:#4b1c2a;color:#ffb4c0}.wrap{max-width:1440px;margin:auto;padding:26px clamp(14px,4vw,54px) 100px}.hero{min-height:330px;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(90deg,#111827 5%,#111827d9 48%,#11182730),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=80') center/cover;display:flex;align-items:end;padding:clamp(22px,5vw,52px);margin-bottom:30px}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#090d16b8,transparent 65%);pointer-events:none}.hero-content{position:relative;max-width:650px}.eyebrow{color:#ff8b9d;font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.06;margin:10px 0}.hero p{color:#d0d8e4;max-width:590px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.section{margin:30px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:15px}.section h2{font-size:21px;margin:0}.filters{display:flex;gap:8px;overflow:auto;padding:2px 1px 12px;scrollbar-width:none}.filters button{white-space:nowrap;border:1px solid var(--line);background:#111a29;color:#c4cede;border-radius:999px;padding:8px 14px;font-size:12px}.filters button.active{background:#a91f3e;border-color:#e84965;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:17px}.movie{min-width:0;border:1px solid var(--line);border-radius:15px;background:#101827;overflow:hidden;transition:.18s transform,.18s border-color}.movie:hover,.movie:focus-within{transform:translateY(-4px);border-color:#e64b68}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:linear-gradient(135deg,#29344b,#111827);display:block}.movie-info{padding:11px}.movie-title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:4px}.movie-buttons{display:flex;gap:6px;margin-top:10px}.movie-buttons button{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:#1a263a;font-size:11px}.movie-buttons .play{background:#b92748;border-color:#b92748}.empty{border:1px dashed #34445d;padding:38px;text-align:center;color:var(--muted);border-radius:18px}.page-title{font-size:27px;margin:6px 0 3px}.panel{background:#111a29;border:1px solid var(--line);border-radius:18px;padding:19px;margin:16px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#c4cede;font-weight:750}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#090f1b;color:white;padding:11px}.field textarea{min-height:85px;resize:vertical}.wide{grid-column:1/-1}.note{background:#2d2515;border:1px solid #68522a;color:#f8dfa2;border-radius:12px;padding:12px;font-size:12px}.goodnote{background:#102b26;border:1px solid #225c4c;color:#a8f0d8;border-radius:12px;padding:12px;font-size:12px}.list{display:grid;gap:9px}.listrow{display:flex;align-items:center;gap:12px;padding:12px;background:#0d1522;border:1px solid var(--line);border-radius:12px}.listrow .grow{flex:1;min-width:0}.listrow strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;padding:16px}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111a29;border:1px solid #34445d;border-radius:20px;padding:20px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modalhead h2{margin:0}.player{position:fixed;inset:0;z-index:60;background:#020409;display:flex;flex-direction:column}.playerbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#080d18;border-bottom:1px solid #26344b}.playerbar strong{flex:1}.videoarea{flex:1;min-height:0;display:grid;place-items:center;background:#000;position:relative}.videoarea video{width:100%;height:100%;object-fit:contain}.playercontrols{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#080d18;border-top:1px solid #26344b}.playercontrols .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.playercontrols input[type=range]{flex:1;min-width:100px}.pill{font-size:11px;color:#ffd0d8;background:#46202d;border:1px solid #743044;padding:3px 8px;border-radius:99px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#f4f7fb;color:#111827;padding:11px 16px;border-radius:12px;z-index:90;font-weight:750;box-shadow:0 10px 30px #0008}.bottomnav{display:none}.footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:12px;margin-top:50px}.sourcebadge{font-size:10px;color:#a7d9ff;background:#17334b;padding:3px 7px;border-radius:99px}
@media(max-width:850px){.nav{display:none}.topbar{height:62px}.search{width:min(38vw,230px)}.hero{min-height:290px}.wrap{padding-top:17px}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:#090d16f2;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.bottomnav button{background:none;border:0;color:var(--muted);font-size:10px;padding:4px}.bottomnav button.active{color:#ff7187}.bottomnav b{display:block;font-size:18px}.wrap{padding-bottom:120px}}
@media(max-width:560px){.brand{font-size:16px}.brandmark{width:33px;height:33px}.topbar{gap:8px;padding:0 12px}.search{width:33vw;padding:9px}.topbar>.primary{padding:9px 10px;font-size:12px}.hero{border-radius:17px;min-height:260px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.section h2{font-size:18px}.playerbar{padding:10px}.playercontrols{padding:10px}.listrow{align-items:flex-start}}
@media(min-width:1100px){body.tv-mode .movie:focus{outline:4px solid #ff637d;outline-offset:3px;transform:scale(1.035)}body.tv-mode button,body.tv-mode input{font-size:1.05em}body.tv-mode .movie{min-width:0}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><div class="brandmark">🎬</div><div>CINESTREAM <span>ULTIMATE</span></div></div>
 <nav class="nav" id="desktopNav">
  <button data-page="home" class="active">Khám phá</button><button data-page="saved">Yêu thích</button><button data-page="history">Lịch sử</button><button data-page="sources">Nguồn của tôi</button>
 </nav>
 <div class="spacer"></div>
 <input id="globalSearch" class="search" placeholder="⌕  Tìm phim..." aria-label="Tìm phim">
 <button class="primary" id="profileBtn">Tài khoản</button>
</header>
<main class="wrap" id="app"></main>
<nav class="bottomnav" id="mobileNav">
 <button data-page="home" class="active"><b>⌂</b>Khám phá</button><button data-page="saved"><b>♡</b>Yêu thích</button><button data-page="history"><b>◷</b>Lịch sử</button><button data-page="sources"><b>＋</b>Nguồn phim</button><button data-page="settings"><b>⚙</b>Cài đặt</button>
</nav>
<div id="modalRoot"></div><div id="playerRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='cineultimate_v1';
const sample=[
{id:'sintel',title:'Sintel',year:2010,genre:'Hoạt hình',region:'Quốc tế',poster:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Sintel_poster.jpg/400px-Sintel_poster.jpg',desc:'Phim hoạt hình ngắn mã nguồn mở của dự án Blender. Nguồn video mẫu công khai.',url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',quality:'HD',source:'Mẫu công khai'},
{id:'tears',title:'Tears of Steel',year:2012,genre:'Khoa học viễn tưởng',region:'Quốc tế',poster:'https://mango.blender.org/wp-content/uploads/2013/05/01_thom_celia_bridge.jpg',desc:'Phim ngắn khoa học viễn tưởng do Blender Foundation phát hành.',url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4',quality:'HD',source:'Mẫu công khai'},
{id:'bunny',title:'Big Buck Bunny',year:2008,genre:'Hoạt hình',region:'Quốc tế',poster:'https://peach.blender.org/wp-content/uploads/title_anouncement.jpg',desc:'Phim hoạt hình ngắn phát hành theo giấy phép Creative Commons.',url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',quality:'HD',source:'Mẫu công khai'},
{id:'elephants',title:'Elephants Dream',year:2006,genre:'Hoạt hình',region:'Quốc tế',poster:'https://orange.blender.org/wp-content/themes/orange/images/media/gallery/s1_proog.jpg',desc:'Tác phẩm hoạt hình mở của Blender Foundation.',url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',quality:'HD',source:'Mẫu công khai'}
];
const blank=()=>({custom:[],saved:[],history:[],profile:{name:'',email:''},apiUrl:'',apiKey:'',lastPage:'home'});
let db;try{db={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch{db=blank();}
let page='home',genre='Tất cả',region='Tất cả',query='',current=null,hls=null;
const movies=()=>[...db.custom,...sample];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Bộ nhớ thiết bị đã đầy. Hãy xuất bản sao lưu.');}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2600);}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setPage(p){page=p;render();window.scrollTo(0,0);}
function filtered(){return movies().filter(m=>(!query||(m.title+' '+(m.desc||'')+' '+(m.genre||'')).toLowerCase().includes(query.toLowerCase()))&&(genre==='Tất cả'||m.genre===genre)&&(region==='Tất cả'||m.region===region));}
function card(m){const fav=db.saved.includes(m.id);return `<article class="movie" tabindex="0"><img class="poster" src="${esc(m.poster||'')}" alt="" loading="lazy" onerror="this.style.opacity='.2'"><div class="movie-info"><div class="movie-title" title="${esc(m.title)}">${esc(m.title)}</div><div class="meta">${esc(m.year||'—')} · ${esc(m.genre||'Khác')} <span class="sourcebadge">${esc(m.quality||'Nguồn riêng')}</span></div><div class="movie-buttons"><button class="play" data-play="${esc(m.id)}">▶ Xem</button><button data-fav="${esc(m.id)}" aria-label="Yêu thích">${fav?'♥':'♡'}</button></div></div></article>`;}
function pageHome(){const list=filtered();const genres=['Tất cả',...new Set(movies().map(m=>m.genre||'Khác'))];const regions=['Tất cả',...new Set(movies().map(m=>m.region||'Khác'))];return `<section class="hero"><div class="hero-content"><div class="eyebrow">YOUR PERSONAL CINEMA</div><h1>Mở rạp phim<br>ngay tại nhà.</h1><p>Thư viện video của bạn, nguồn phim hợp pháp và nội dung do bạn tự thêm. Tối ưu cho điện thoại, máy tính và Android TV.</p><div class="actions"><button class="primary" id="heroExplore">Khám phá thư viện</button><button class="secondary" id="heroAdd">＋ Thêm nguồn phim</button></div></div></section><section class="section"><div class="section-head"><div><h2>Khám phá phim</h2><div class="small muted">${list.length} nội dung trong thư viện hiện tại</div></div><button class="ghost" id="clearFilters">Đặt lại lọc</button></div><div class="filters">${genres.map(g=>`<button class="${genre===g?'active':''}" data-genre="${esc(g)}">${esc(g)}</button>`).join('')}</div><div class="filters">${regions.map(r=>`<button class="${region===r?'active':''}" data-region="${esc(r)}">${esc(r)}</button>`).join('')}</div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">Không tìm thấy phim phù hợp. Hãy thử từ khóa hoặc bộ lọc khác.</div>`}</section><section class="section"><div class="section-head"><h2>Nguồn xem hợp pháp</h2></div><div class="panel"><p class="muted">Bạn có thể khám phá nội dung thuộc phạm vi công cộng hoặc giấy phép mở tại các kho sau. Từng tác phẩm vẫn cần được kiểm tra giấy phép cụ thể trước khi phát lại hoặc phân phối.</p><div class="actions"><a class="secondary" href="https://archive.org/details/movies" target="_blank" rel="noopener">Internet Archive Movies ↗</a><a class="secondary" href="https://commons.wikimedia.org/wiki/Category:Videos" target="_blank" rel="noopener">Wikimedia Commons Videos ↗</a><a class="secondary" href="https://www.blender.org/about/projects/" target="_blank" rel="noopener">Blender Open Movies ↗</a></div></div></section>`;}
function pageSaved(){const list=movies().filter(m=>db.saved.includes(m.id));return `<h1 class="page-title">Danh sách yêu thích</h1><p class="muted">Các phim bạn đã lưu trên thiết bị này.</p>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">Chưa có phim yêu thích. Nhấn ♡ trên một phim để lưu.</div>'}`;}
function pageHistory(){return `<h1 class="page-title">Lịch sử xem</h1><p class="muted">Lịch sử được lưu cục bộ trong trình duyệt này.</p><div class="actions"><button class="danger" id="clearHistory">Xóa lịch sử</button></div><div class="list">${db.history.length?db.history.map(h=>`<div class="listrow"><div class="grow"><strong>${esc(h.title)}</strong><span class="small muted">Đã xem ${new Date(h.at).toLocaleString('vi-VN')} · ${esc(h.position||0)} giây</span></div><button class="secondary" data-play="${esc(h.id)}">Xem lại</button></div>`).join(''):'<div class="empty">Chưa có lịch sử xem.</div>'}</div>`;}
function pageSources(){return `<h1 class="page-title">Nguồn phim của tôi</h1><p class="muted">Thêm các đường dẫn video mà bạn sở hữu hoặc được cấp quyền sử dụng.</p><div class="note">Chỉ thêm URL trực tiếp hợp pháp. Ứng dụng không cung cấp danh sách link phim lậu, không vượt DRM hoặc paywall. MP4 thường phát trực tiếp; HLS/M3U8 cần trình duyệt hỗ trợ hoặc thư viện HLS.</div><form class="panel form-grid" id="sourceForm"><div class="field"><label>Tên phim *</label><input name="title" required placeholder="Tên nội dung"></div><div class="field"><label>Thể loại</label><select name="genre">${['Hành động','Tình cảm','Hoạt hình','Khoa học viễn tưởng','Tài liệu','Gia đình','Khác'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field wide"><label>URL video MP4 / M3U8 *</label><input name="url" type="url" required placeholder="https://example.com/video.mp4"></div><div class="field"><label>URL poster (tùy chọn)</label><input name="poster" type="url" placeholder="https://...jpg"></div><div class="field"><label>Năm phát hành</label><input name="year" type="number" min="1888" max="2100" value="${new Date().getFullYear()}"></div><div class="field"><label>Khu vực</label><input name="region" value="Cá nhân"></div><div class="field"><label>Nhãn chất lượng</label><select name="quality"><option>Auto</option><option>480p</option><option>720p</option><option>1080p</option><option>2K</option><option>4K</option></select></div><div class="field wide"><label>Mô tả</label><textarea name="desc" placeholder="Thông tin nội dung và quyền sử dụng..."></textarea></div><div class="wide"><button class="primary">＋ Lưu nguồn phim</button></div></form><div class="section-head"><h2>Nguồn đã thêm (${db.custom.length})</h2></div><div class="list">${db.custom.length?db.custom.map(m=>`<div class="listrow"><div class="grow"><strong>${esc(m.title)}</strong><span class="small muted">${esc(m.genre)} · ${esc(m.quality)}</span></div><button class="secondary" data-play="${esc(m.id)}">Thử phát</button><button class="danger" data-delete="${esc(m.id)}">Xóa</button></div>`).join(''):'<div class="empty">Bạn chưa thêm nguồn nào.</div>'}</div>`;}
function pageSettings(){return `<h1 class="page-title">Cài đặt & dữ liệu</h1><p class="muted">Hồ sơ cục bộ, cấu hình API và sao lưu dữ liệu.</p><div class="panel"><h2>Hồ sơ trên thiết bị</h2><form id="profileForm" class="form-grid"><div class="field"><label>Tên hiển thị</label><input name="name" value="${esc(db.profile.name)}" placeholder="Tên của bạn"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(db.profile.email)}" placeholder="you@example.com"></div><div class="wide"><button class="primary">Lưu hồ sơ</button></div></form><p class="small muted">Đây không phải hệ thống đăng nhập bảo mật. Không nhập mật khẩu hoặc thông tin nhạy cảm.</p></div><div class="panel"><h2>Kết nối API thư viện riêng (tùy chọn)</h2><p class="small muted">Endpoint của bạn cần trả về JSON dạng mảng phim hoặc { "movies": [...] }. Mỗi phim gồm title, url, poster, genre, year, region, desc. Chỉ dùng API bạn có quyền truy cập.</p><form id="apiForm" class="form-grid"><div class="field wide"><label>URL API danh mục</label><input name="apiUrl" type="url" value="${esc(db.apiUrl)}" placeholder="https://your-domain.example/api/movies"></div><div class="field wide"><label>API key (nếu endpoint yêu cầu)</label><input name="apiKey" value="${esc(db.apiKey)}" placeholder="Không khuyến nghị lưu khóa bí mật ở trình duyệt"></div><div class="wide actions"><button class="primary">Lưu cấu hình</button><button type="button" class="secondary" id="loadApi">Tải danh mục API</button></div></form><div id="apiStatus" class="small muted"></div></div><div class="panel"><h2>Sao lưu & khôi phục</h2><p class="small muted">Sao lưu danh sách phim cá nhân, yêu thích, lịch sử và hồ sơ. Không bao gồm file video gốc.</p><div class="actions"><button class="primary" id="exportData">Xuất bản sao lưu JSON</button><label class="secondary">Nhập bản sao lưu <input id="importData" type="file" accept="application/json" hidden></label><button class="danger" id="resetData">Đặt lại dữ liệu</button></div></div><div class="panel"><h2>Thiết bị & quyền riêng tư</h2><div class="goodnote">Ứng dụng chạy trực tiếp từ một file HTML. Dữ liệu lưu trong localStorage của trình duyệt hiện tại. Muốn đồng bộ thật giữa điện thoại và TV cần triển khai backend có xác thực, cơ sở dữ liệu và HTTPS.</div><div class="actions"><button class="secondary" id="tvMode">Bật/tắt chế độ Android TV</button><a class="secondary" href="https://developer.android.com/develop/ui/views/layout/webapps" target="_blank" rel="noopener">Tài liệu WebView Android ↗</a></div></div>`;}
function render(){const app=$('#app');const pages={home:pageHome,saved:pageSaved,history:pageHistory,sources:pageSources,settings:pageSettings};app.innerHTML=(pages[page]||pageHome)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));bindPage();}
function bindPage(){
 $('#heroExplore')?.addEventListener('click',()=>document.querySelector('.section')?.scrollIntoView({behavior:'smooth'}));
 $('#heroAdd')?.addEventListener('click',()=>setPage('sources'));
 document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{genre=b.dataset.genre;render();});
 document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;render();});
 $('#clearFilters')?.addEventListener('click',()=>{genre='Tất cả';region='Tất cả';query='';$('#globalSearch').value='';render();});
 document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playById(b.dataset.play));
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;db.saved=db.saved.includes(id)?db.saved.filter(x=>x!==id):[...db.saved,id];persist();render();toast('Đã cập nhật yêu thích');});
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{db.custom=db.custom.filter(m=>m.id!==b.dataset.delete);persist();render();toast('Đã xóa nguồn');});
 $('#sourceForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const m={id:'user-'+Date.now(),title:f.get('title').trim(),url:f.get('url').trim(),poster:f.get('poster').trim(),genre:f.get('genre'),year:Number(f.get('year'))||null,region:f.get('region')||'Cá nhân',quality:f.get('quality'),desc:f.get('desc'),source:'Nguồn của bạn'};if(!/^https?:\/\//i.test(m.url)){toast('URL phải bắt đầu bằng http:// hoặc https://');return;}db.custom.unshift(m);persist();e.target.reset();render();toast('Đã thêm nguồn phim');});
 $('#clearHistory')?.addEventListener('click',()=>{db.history=[];persist();render();});
 $('#profileForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.profile={name:f.get('name'),email:f.get('email')};persist();toast('Đã lưu hồ sơ cục bộ');});
 $('#apiForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.apiUrl=f.get('apiUrl').trim();db.apiKey=f.get('apiKey').trim();persist();toast('Đã lưu cấu hình API');});
 $('#loadApi')?.addEventListener('click',loadApi);
 $('#exportData')?.addEventListener('click',exportData);
 $('#importData')?.addEventListener('change',importData);
 $('#resetData')?.addEventListener('click',()=>{if(confirm('Xóa dữ liệu CineStream trên thiết bị này?')){localStorage.removeItem(KEY);db=blank();render();toast('Đã đặt lại dữ liệu');}});
 $('#tvMode')?.addEventListener('click',()=>{document.body.classList.toggle('tv-mode');toast(document.body.classList.contains('tv-mode')?'Đã bật chế độ TV':'Đã tắt chế độ TV');});
}
function playById(id){const m=movies().find(x=>x.id===id)||db.apiMovies?.find(x=>x.id===id);if(!m){toast('Không tìm thấy nội dung');return;}play(m);}
function play(m){
 current=m;const root=$('#playerRoot');root.innerHTML=`<div class="player"><div class="playerbar"><button class="secondary" id="closePlayer">← Quay lại</button><strong>${esc(m.title)}</strong><span class="pill">${esc(m.quality||'Auto')}</span></div><div class="videoarea"><video id="video" playsinline controls autoplay poster="${esc(m.poster||'')}"></video><div id="playError" class="note hidden" style="position:absolute;max-width:85%">Không phát được nguồn. Kiểm tra URL, CORS, định dạng hoặc quyền truy cập.</div></div><div class="playercontrols"><div class="row"><button class="secondary" id="back10">↶ 10 giây</button><button class="secondary" id="forward10">10 giây ↷</button><label class="small muted">Tốc độ <select id="speed" class="secondary"><option>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><button class="secondary" id="fullscreen">⛶ Toàn màn hình</button><button class="secondary" id="pip">▣ PiP</button></div><div class="small muted" style="margin-top:8px">Nguồn: ${esc(m.source||'Nguồn cá nhân')} · Chỉ chất lượng thực tế của URL nguồn mới quyết định độ phân giải.</div></div></div>`;
 const video=$('#video');const url=m.url||m.sources?.auto||m.sources?.['1080p'];if(url){if(/\.m3u8(\?|$)/i.test(url)){const native=video.canPlayType('application/vnd.apple.mpegurl');if(native)video.src=url;else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$('#playError').classList.remove('hidden');});}else{video.src=url;}}else video.src=url;}
 video.addEventListener('error',()=>$('#playError')?.classList.remove('hidden'));
 const close=()=>{try{video.pause();}catch{}if(hls){hls.destroy();hls=null;}root.innerHTML='';current=null;};
 $('#closePlayer').onclick=()=>{saveHistory(m,video.currentTime);close();};
 $('#back10').onclick=()=>video.currentTime=Math.max(0,video.currentTime-10);
 $('#forward10').onclick=()=>video.currentTime=Math.min(video.duration||Infinity,video.currentTime+10);
 $('#speed').onchange=e=>video.playbackRate=Number(e.target.value);
 $('#fullscreen').onclick=()=>{if(video.requestFullscreen)video.requestFullscreen();else if(root.firstChild.requestFullscreen)root.firstChild.requestFullscreen();};
 $('#pip').onclick=()=>{if(document.pictureInPictureEnabled&&video.requestPictureInPicture)video.requestPictureInPicture().catch(()=>toast('PiP không được hỗ trợ trên thiết bị này'));else toast('Thiết bị không hỗ trợ PiP');};
 video.addEventListener('ended',()=>saveHistory(m,video.duration));
}
function saveHistory(m,pos){db.history=[{id:m.id,title:m.title,position:Math.floor(pos||0),at:Date.now()},...db.history.filter(x=>x.id!==m.id)].slice(0,100);persist();}
async function loadApi(){const status=$('#apiStatus');if(!db.apiUrl){status.textContent='Hãy nhập URL API trước.';return;}status.textContent='Đang tải danh mục...';try{const r=await fetch(db.apiUrl,{headers:db.apiKey?{'Authorization':'Bearer '+db.apiKey}:{}});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const arr=Array.isArray(data)?data:data.movies;if(!Array.isArray(arr))throw Error('JSON cần là mảng hoặc có thuộc tính movies');const imported=arr.filter(x=>x&&x.title&&x.url).map((x,i)=>({...x,id:'api-'+(x.id||i),source:'API riêng'}));db.custom=[...imported.filter(x=>!db.custom.some(y=>y.id===x.id)),...db.custom];persist();status.textContent=`Đã nhập ${imported.length} mục từ API.`;render();}catch(e){status.textContent='Không tải được API: '+e.message+'. Kiểm tra CORS và cấu hình endpoint.';}}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cinestream-ultimate-backup.json';a.click();URL.revokeObjectURL(a.href);}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);db={...blank(),...d};persist();render();toast('Đã khôi phục bản sao lưu');}catch{toast('Tệp JSON không hợp lệ');}};r.readAsText(f);}
$('#globalSearch').addEventListener('input',e=>{query=e.target.value;if(page!=='home')page='home';render();const inp=$('#globalSearch');inp.focus();inp.setSelectionRange(query.length,query.length);});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('#profileBtn').onclick=()=>setPage('settings');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current){$('#closePlayer')?.click();return;}if(current){const v=$('#video');if(e.key==='ArrowRight')v.currentTime+=10;if(e.key==='ArrowLeft')v.currentTime=Math.max(0,v.currentTime-10);if(e.key.toLowerCase()==='f')$('#fullscreen')?.click();}});
render();
if(location.protocol==='file:')console.info('CineStream đang chạy dạng file độc lập. API từ xa có thể bị giới hạn CORS; dùng HTTPS/localhost để kết nối API ổn định.');
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</body></html>
